[project]
name = "factory-sensor-anomaly"
version = "0.0.1"
description = "End-to-end anomaly detection service for factory sensor time-series (pressure / temperature / RPM / vibration)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Naoya Higashitani" }]
keywords = ["anomaly-detection", "industrial-iot", "fastapi", "streamlit", "mlops"]

dependencies = [
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "numpy>=2.1",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "structlog>=24.4",
  "streamlit>=1.40",
  "plotly>=5.24",
  "httpx>=0.27",
  "prometheus-client>=0.21",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "statsmodels>=0.14",
]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pre-commit>=3.8",
  "testcontainers[postgres]>=4.8",
  "pandas-stubs>=2.2",
]
# Phase 3 — image anomaly. Isolated group so the default sync stays light
# (torch CPU wheel is ~250MB, ResNet50 weights ~100MB). See ADR-0006.
image = [
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "pillow>=10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_anomaly"]

# ---------------------------------------------------------------------------
# uv — force torch / torchvision to the CPU-only PyTorch index. Without this,
# Linux locks pull ~3GB of nvidia-cuda wheels (CUDA is the upstream default).
# Inference for PatchCore on this project's scale runs fine on CPU.
# ---------------------------------------------------------------------------
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------------------
# Ruff — lint + format (replaces Black + Flake8 + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["data", "models", "notebooks"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
  "S",   # flake8-bandit (security)
  "N",   # pep8-naming
  "TID", # flake8-tidy-imports
]
ignore = [
  "E501",  # line length handled by formatter
  "S101",  # allow `assert` in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict-ish, evolving
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests", "alembic", "dashboard", "scripts"]
# NOTE: src/factory_anomaly/image/ and tests/image/ require the optional
# `image` dependency group (torch). The default `mypy` invocation in CI
# adds `--exclude` for them; the dedicated `image-quality` CI job
# type-checks them explicitly. (The exclude lives in CI rather than here
# because mypy applies pyproject `exclude` even to files passed on the
# command line, which would block the image-quality job.)
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
# mypy `*` matches a single dot-separated component, so nested test packages
# (e.g. tests.image.test_*) need their own pattern.
module = ["tests.*", "tests.image.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=factory_anomaly",
  "--cov-report=term-missing",
]
# NOTE: --cov-fail-under is enforced in CI (.github/workflows/ci.yml) against
# the full suite (unit + integration). Local subset runs (e.g. `make test-unit`
# without Docker) intentionally do not enforce a threshold.
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration (spins up real services via testcontainers)",
]

[[tool.mypy.overrides]]
module = [
  "testcontainers.*",
  "sklearn.*",
  "joblib.*",
  "streamlit.*",
  "plotly.*",
  "scipy.*",
  "prometheus_client.*",
  "statsmodels.*",
  "torch.*",
  "torchvision.*",
  "PIL.*",
]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/factory_anomaly"]
# image/ requires the optional `image` dep group (torch). Excluded from the
# default coverage run; the image-quality CI job tests it without coverage.
omit = ["src/factory_anomaly/image/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
