name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (default — no image group; see ADR-0006)
        run: uv sync --group dev --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (image module excluded; covered by image-quality job)
        run: uv run mypy --exclude '(src/factory_anomaly/image|tests/image)'

      - name: Pytest (unit + integration via testcontainers)
        run: uv run pytest --cov-fail-under=70 --ignore=tests/image

  image-quality:
    name: Image module — lint, typecheck, test (PatchCore / torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (dev + image group; torch CPU only)
        run: uv sync --group dev --group image --frozen

      - name: Ruff lint (image module + its tests)
        run: uv run ruff check --output-format=github src/factory_anomaly/image tests/image

      # Tests under tests/image add scripts/ to sys.path at runtime to import
      # download_mvtec / evaluate_image. Include those scripts here so mypy
      # can resolve the imports during static analysis too.
      - name: Mypy (image module + its tests + image scripts)
        run: |
          uv run mypy \
            src/factory_anomaly/image \
            tests/image \
            scripts/download_mvtec.py \
            scripts/evaluate_image.py \
            scripts/train_image_stub.py

      - name: Pytest (image module only; no testcontainers needed)
        run: uv run pytest tests/image --no-cov

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
