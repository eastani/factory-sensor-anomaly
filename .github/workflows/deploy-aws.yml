name: deploy-aws

# NOTE: deliberately *not* on `push: main` until the AWS bootstrap stack has
# been applied and the GitHub secrets below are populated. After bootstrap:
# add `push:` back, or rely on workflow_dispatch.
#
# Required secrets:
#   - AWS_DEPLOY_ROLE_ARN
#   - TF_STATE_BUCKET
#   - TF_STATE_LOCK_TABLE
#   - BILLING_ALARM_EMAIL  (optional but recommended)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy (defaults to commit SHA)"
        required: false
        default: ""

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: "1.9.8"
  PROJECT_NAME: factory-sensor-anomaly

jobs:
  build-and-push:
    name: Build image and push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      image_uri: ${{ steps.tag.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: tag
        run: |
          tag="${{ github.event.inputs.image_tag }}"
          if [ -z "${tag}" ]; then
            tag="${GITHUB_SHA::12}"
          fi
          registry="${{ steps.ecr.outputs.registry }}"
          uri="${registry}/${PROJECT_NAME}:${tag}"
          echo "value=${tag}" >> "$GITHUB_OUTPUT"
          echo "uri=${uri}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.uri }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          platforms: linux/amd64

  terraform:
    name: terraform apply
    runs-on: ubuntu-latest
    needs: build-and-push
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive ..

      - name: terraform validate
        run: terraform validate

      - name: terraform apply
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_image_tag: ${{ needs.build-and-push.outputs.image_tag }}
          TF_VAR_alarm_email: ${{ secrets.BILLING_ALARM_EMAIL }}
        run: terraform apply -auto-approve

      - name: Smoke test /healthz
        run: |
          url=$(terraform output -raw api_service_url)
          echo "API URL: $url"
          # App Runner can take ~30s past terraform-apply to be ready.
          for i in $(seq 1 12); do
            if curl -fsS "${url}/healthz" >/dev/null; then
              echo "Service healthy"
              curl -s "${url}/healthz" | tee /tmp/healthz.json
              exit 0
            fi
            echo "attempt $i: not ready yet, sleeping 10s"
            sleep 10
          done
          echo "Service did not become healthy in time" >&2
          exit 1
